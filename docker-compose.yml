# Local development only. Not a production topology (see DEPLOYMENT_GUIDE.md).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: quickcred
      POSTGRES_PASSWORD: quickcred_local_only
      POSTGRES_DB: quickcred
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata: {}
